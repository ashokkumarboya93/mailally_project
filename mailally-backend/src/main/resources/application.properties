spring.application.name=mailally-backend
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/mailally?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# HikariCP Enterprise High-Throughput Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true

# High-Speed Brevo Rate Limit & Batch Controls (300 emails per 3 seconds power throughput)
mail.campaign.rate-limit-per-second=100
mail.campaign.batch.delay-ms=3000
mail.campaign.worker.concurrency=4
mail.campaign.batch.default-size=300
mail.campaign.batch.max-size=300

# JWT Configuration
application.security.jwt.secret-key=MailAllySuperSecretKeyForJWTAuthentication2026ProductionGradeTokenGenerationKey
application.security.jwt.expiration=86400000

# ============================================
# Email Engine Configuration
# ============================================

# Active Provider: SES | SMTP | BREVO
mailally.email.active-provider=BREVO
mailally.email.default-sender-name=MailAlly Team
mailally.email.default-sender-email=info@marcamor.com
mailally.email.max-retries=3

# SMTP Configuration (Amazon SES Mail Manager Relay)
spring.mail.host=${MAIL_HOST:t4wqp5nrj2yv.fips.wmjb.mail-manager-smtp.amazonaws.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-smtp-username}
spring.mail.password=${MAIL_PASSWORD:your-smtp-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.mail.properties.mail.smtp.tcpNoDelay=true
spring.mail.properties.mail.smtp.quitwait=false

# Brevo (Sendinblue) Configuration
mailally.email.brevo.api-key=${BREVO_API_KEY:YOUR_BREVO_API_KEY}
mailally.email.brevo.api-url=https://api.brevo.com/v3/smtp/email
mailally.email.brevo.sender-name=Sandeep Tekkali
mailally.email.brevo.sender-email=info@marcamor.com
mailally.email.brevo.smtp-host=smtp-relay.brevo.com
mailally.email.brevo.smtp-port=587

# Amazon SES Configuration
mailally.email.ses.access-key=${AWS_SES_ACCESS_KEY:your-ses-access-key}
mailally.email.ses.secret-key=${AWS_SES_SECRET_KEY:your-ses-secret-key}
mailally.email.ses.region=${AWS_SES_REGION:ap-south-1}

# Gemini AI Engine Configuration
mailally.ai.active-provider=GEMINI
mailally.ai.gemini-api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# ============================================
# Redis Connection Configuration
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# ============================================
# Kafka Broker Configuration
# ============================================
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=mailally-group

# ============================================
# Quartz Scheduler Configuration
# ============================================
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# ============================================
# Google Integration Configuration
# ============================================
google.oauth.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/integrations/google/callback}
google.oauth.encryption-secret=${GOOGLE_TOKEN_ENCRYPTION_SECRET:MailAllySuperSecretTokenEncryptionKey2026AES256GCM}